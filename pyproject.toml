[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fdmnes-util"
version = "0.0.0"
description = "FDMNES per-output-file Python analysis and visualization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
structure = ["vasp-util"]
test = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
fdmnes_util = "fdmnes_util.cli:main"

[tool.setuptools.package-data]
fdmnes_util = ["atomic_symbols.list"]

[tool.setuptools.data-files]
"share/fdmnes_util/scripts" = ["scripts/*.py"]
